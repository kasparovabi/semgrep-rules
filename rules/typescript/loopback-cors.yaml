rules:
  - id: ts-express-open-cors-on-loopback-server
    languages: [typescript, javascript]
    severity: WARNING
    message: >-
      This Express app enables CORS for every origin and listens on a loopback
      address. Binding to 127.0.0.1 keeps other hosts out, but the user's own
      browser is a loopback client too, so any page it has open can call this
      API and read the responses. List the origins that need access, and add
      authentication if the API holds private data. origin: true is worse than
      "*", because it reflects every origin and can be combined with
      credentials.
    metadata:
      category: security
      cwe:
        - "CWE-942: Permissive Cross-domain Policy with Untrusted Domains"
      references:
        - https://github.com/GuyMannDude/mnemo-cortex/security/advisories/GHSA-682p-grrx-wrwg
        - https://github.com/kasparovabi/security-research/blob/main/2026-10-mnemo-cortex-cors-loopback.md
      confidence: MEDIUM
      likelihood: MEDIUM
      impact: HIGH
    patterns:
      - pattern-either:
          - pattern-inside: |
              $APP.use(...);
              ...
              $APP.listen($PORT, $HOST, ...);
          - pattern-inside: |
              $APP.use(...);
              ...
              $S = $APP.listen($PORT, $HOST, ...);
      - metavariable-regex:
          metavariable: $HOST
          regex: ^["'](127\.0\.0\.1|localhost|::1)["']$
      - pattern-either:
          - pattern: $APP.use(cors())
          - pattern: '$APP.use(cors({..., origin: "*", ...}))'
          - pattern: '$APP.use(cors({..., origin: true, ...}))'
